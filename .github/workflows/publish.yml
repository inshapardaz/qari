name: Build, Test & Publish

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify NPM_TOKEN is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is empty or not visible to this workflow."
            echo "::error::Add it under Settings > Secrets and variables > Actions > 'New repository secret' on this repo (not an Environment, Dependabot, or Codespaces secret), named exactly NPM_TOKEN."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version (main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): v%s [skip ci]"

      - name: Push version bump
        if: github.ref == 'refs/heads/main'
        run: git push origin HEAD:main --follow-tags

      - name: Build
        run: npm run build

      - name: Publish release version (main)
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION is already published. Skipping."
          else
            npm publish --tag latest --provenance --access public
          fi

      - name: Publish dev version (other branches)
        if: github.ref != 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          DEV_VERSION="${BASE_VERSION}-dev.${{ github.run_number }}"
          npm version "$DEV_VERSION" --no-git-tag-version --allow-same-version
          npm publish --tag dev --provenance --access public
